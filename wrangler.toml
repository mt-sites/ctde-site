name = "ctde-site"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "REQUESTS"
id = "069bf6e2b3c14191872c18eacd9fe79c"

[triggers]
crons = ["0 16 * * *"]   # daily CHECK at midnight Philippine time (16:00 UTC); a backup only happens when the data size limit is reached
